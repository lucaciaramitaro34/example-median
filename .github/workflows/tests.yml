name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The test cases are inlined here rather than in a tests/ directory
      # so that the entire specification of the lab is the one file a
      # student has to remember to add to their prompt with `files-to-prompt
      # . .github`.  A missing test case is exactly the failure mode this
      # lab teaches students to avoid.
      - name: test
        run: |
          python3 - <<'PY'
          import stats

          # mean
          assert stats.mean([1, 2, 3, 4]) == 2.5
          assert stats.mean([5]) == 5
          assert stats.mean([-1, 0, 1]) == 0

          # median: odd-length works, even-length must average the two middles
          assert stats.median([3, 1, 2]) == 2
          assert stats.median([1, 2, 3, 4]) == 2.5
          assert stats.median([4, 1, 3, 2]) == 2.5

          # mode: ties broken by first appearance
          assert stats.mode([1, 2, 2, 3]) == 2
          assert stats.mode([1, 1, 2, 2]) == 1

          print("all tests passed")
          PY
